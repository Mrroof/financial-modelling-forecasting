name: Workbook validation
on:
  push:
    paths:
      - "model/**"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:
jobs:
  validate-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook validator
        run: python -m pip install --upgrade pip openpyxl
      - name: Inspect workbook structure and formulas
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          files = list(Path("model").glob("*.xlsx"))
          assert files, "No .xlsx workbook found in model/"
          for path in files:
              wb = load_workbook(path, data_only=False)
              print(f"Workbook: {path}")
              print("Sheets:", wb.sheetnames)
              formula_count = 0
              for ws in wb.worksheets:
                  formulas = [c.coordinate for row in ws.iter_rows() for c in row if isinstance(c.value, str) and c.value.startswith("=")]
                  formula_count += len(formulas)
                  print(f"{ws.title}: {ws.max_row} rows x {ws.max_column} cols; {len(formulas)} formulas")
              print("Total formulas:", formula_count)
              assert wb.sheetnames, "Workbook has no worksheets"
          PY
